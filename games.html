<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <link rel="stylesheet" href="style.css">

    <title>Gus Mini-Games</title>
</head>

<body>

<main class="game-wrapper games-page">

    <h1>Choose a Game</h1>

    <div class="games-menu">

        <a href="mouseGame.html" class="game-card">
            <img src="assets/icon/mouse.png" alt="Mouse Chase">
            <h2>Mouse Chase</h2>
            <p>Tap the mouse before it escapes!</p>
        </a>

        <a href="fishGame.html" class="game-card">
            <img src="assets/icon/fishNormal.png" alt="Catch the Fish">
            <h2>Catch the Fish</h2>
            <p>Catch as many fish as you can.</p>
        </a>

        <a href="matchGame.html" class="game-card">
            <img src="assets/icon/play.png" alt="Memory Match">
            <h2>Memory Match</h2>
            <p>Find all the matching pairs.</p>
        </a>

    </div>

    <button
        class="back-button"
        onclick="window.location.href='index.html'"
    >
        ← Back to Gus
    </button>

</main>
<script src="music.js"></script>
</body>
</html>
