<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">
  <title>Gus the Game</title>
</head>

<body>
  <main class="game-wrapper">
    <h1>Gus the Game</h1>

<div class="tamagotchi">
  <img src="assets/case/greyTG.png" alt="Tamagotchi case" class="case">

  <div class="screen">
    <div class="scene">
      <img     
      id="backgroundSprite"
    src="assets/background/sunny.png"
    alt="Game background"
    class="background">
      <img
        id="catSprite"
        src="assets/cat/gusOG.gif"
        alt="Pixel cat"
        class="cat"
      >
      <div class="screen-menu">
        <img id="selectedIcon" src="assets/icon/feed.png" alt="Selected action">
        <span id="selectedAction">Feed</span>
      </div>
    </div>
  </div>

  <div class="device-buttons">
    <button class="device-btn btn-left" onclick="previousMenuItem()" aria-label="Previous option"></button>
    <button class="device-btn btn-middle" onclick="selectMenuItem()" aria-label="Select option"></button>
    <button class="device-btn btn-right" onclick="nextMenuItem()" aria-label="Next option"></button>
  </div>
</div>
<div class="stats">
  <div class="stat">
    Hunger
    <div class="bar"><div id="hungerBar" class="fill"></div></div>
  </div>

  <div class="stat">
    Happiness
    <div class="bar"><div id="happyBar" class="fill"></div></div>
  </div>

  <div class="stat">
    Energy
    <div class="bar"><div id="energyBar" class="fill"></div></div>
  </div>

  <div class="coins">
    <img src="assets/icon/coin.png" alt="Coin">
    <span id="coins">0</span>
  </div>
</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
