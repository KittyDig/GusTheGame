<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <link rel="stylesheet" href="style.css">

  <title>Fish Catch</title>
</head>

<body>

<main class="game-wrapper mini-game-page">

  <div class="game-info">
    Score: <span id="fishScore">0</span>
    |
    Time: <span id="fishTime">20</span>
  </div>

  <div id="fishGameArea" class="fish-game-area">

    <div id="fallingItems"></div>

    <img
      id="catcherCat"
      src="assets/icon/pop1.png"
      alt="Gus catching fish"
      class="catcher-cat"
    >

  </div>

  <button
    class="back-button"
    onclick="window.location.href='games.html'"
  >
    ← Back to Games
  </button>

</main>

<script src="fishGame.js"></script>
<script src="music.js"></script>
</body>
</html>
