<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> />
  <link rel="stylesheet" href="style.css">
  <title>Gus Shop</title>
</head>

<body>
  <main class="game-wrapper">
    <h1>Shop</h1>

    <div class="stats shop-panel">
      <h2>Cases</h2>

      <div class="shop-item">
        <img src="assets/case/test.png" alt="Red case">
        <p>Red Case</p>
        <p>100 coins</p>
        <button>Buy</button>
      </div>

      <h2>Cats</h2>

      <div class="shop-item">
        <img src="assets/cat/cat2.png" alt="Grey cat">
        <p>Grey Cat</p>
        <p>100 coins</p>
        <button>Buy</button>
      </div>

      <h2>Backgrounds</h2>

      <div class="shop-item">
        <img src="assets/background/sunny.png" alt="Sunny background">
        <p>Sunny</p>
        <p>100 coins</p>
        <button>Buy</button>
      </div>
    </div>

    <button onclick="window.location.href='index.html'">
      Back to Game
    </button>
  </main>
</body>
</html>
