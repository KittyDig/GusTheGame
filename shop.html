<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <title>Gus Shop</title>
</head>

<body>
  <main class="game-wrapper shop-page">

    <div class="shopping-street">

<a
    href="casesShop.html"
    class="street-shop cases-door"
    onclick="enterShop(event, 'casesShop.html')"
>
    <img
        src="assets/icon/casesShop.png"
        alt="Case shop"
    >
</a>

<a
    href="clothesShop.html"
    class="street-shop clothes-door"
    onclick="enterShop(event, 'clothesShop.html')"
>
    <img
        src="assets/icon/clothesShop.png"
        alt="Clothes shop"
    >
</a>

<a
    href="bgShop.html"
    class="street-shop bg-door"
    onclick="enterShop(event, 'bgShop.html')"
>
    <img
        src="assets/icon/bgShop.png"
        alt="Background shop"
    >
</a>
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">
      Back to Game
    </button>
  </main>
  <script src="music.js"></script>
  <script src="shop.js"></script>
</body>
</html>
